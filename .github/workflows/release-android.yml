name: Build signed release APK (optional)

# Manual only. Needs four repository secrets (Settings > Secrets and variables > Actions):
#   SNAPGPT_KEYSTORE_BASE64   base64 of your release keystore file  (base64 -w0 release.jks)
#   SNAPGPT_KEYSTORE_PASSWORD keystore password
#   SNAPGPT_KEY_ALIAS         key alias
#   SNAPGPT_KEY_PASSWORD      key password
# The keystore is decoded to a temporary runner directory and is never committed to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # Do not request the removed legacy SDK package named 'tools'.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are configured
        env:
          KS: ${{ secrets.SNAPGPT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret SNAPGPT_KEYSTORE_BASE64 is not set. See docs in README.md (Release signing)."
            exit 1
          fi

      - name: Decode keystore to a temporary file
        env:
          KS: ${{ secrets.SNAPGPT_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNAPGPT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew test --stacktrace

      - name: Build release APK
        env:
          SNAPGPT_KEYSTORE_PASSWORD: ${{ secrets.SNAPGPT_KEYSTORE_PASSWORD }}
          SNAPGPT_KEY_ALIAS: ${{ secrets.SNAPGPT_KEY_ALIAS }}
          SNAPGPT_KEY_PASSWORD: ${{ secrets.SNAPGPT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapGPT-Android-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
