name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build the debug APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Upload the APK (one APK for every provider)
        uses: actions/upload-artifact@v4
        with:
          name: SnapGPT-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports and build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SnapGPT-Android-Build-Logs
          path: |
            app/build/reports/
            app/build/test-results/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 14
